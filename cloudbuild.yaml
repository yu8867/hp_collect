steps:
  # 1. Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/frontend-multi-app/frontend:latest"
      - "."

  # 2. Push Docker image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/frontend-multi-app/frontend:latest"

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "frontend-multi-app",
        "--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/frontend-multi-app/frontend:latest",
        "--region=asia-northeast1",
        "--platform=managed",
        "--allow-unauthenticated",
        "--port=80",
        "--memory=512Mi",
        "--max-instances=3",
      ]

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/frontend-multi-app/frontend:latest"
