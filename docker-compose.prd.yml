services:
  frontend1:
    build:
      context: ./lp-collect
      dockerfile: Dockerfile.prd
    container_name: lp_collect_frontend1
    environment:
      - VITE_BASE_URL=https://nexgen-web.com
      - VITE_MAIL_API_URL=https://nexgen-web.com/api
    ports:
      - "3001:80"
    networks:
      - webnet
    depends_on:
      - mail-server

  mail-server:
    build:
      context: ./mail-server
      dockerfile: Dockerfile.prd
    container_name: mail_server
    env_file:
      - ./mail-server/.env
    ports:
      - "8000:8000"
    networks:
      - webnet

  frontend2:
    build:
      context: ./YORHA_v2
      dockerfile: Dockerfile.prd
    container_name: yorha_v2_frontend2
    ports:
      - "3002:80"
    networks:
      - webnet

  frontend3:
    build:
      context: ./kid-app
      dockerfile: Dockerfile.prd
    container_name: kid_frontend3
    ports:
      - "3003:80"
    networks:
      - webnet

  frontend4:
    build:
      context: ./the-stack-burger
      dockerfile: Dockerfile.prd
    container_name: the_stack_burger_frontend4
    ports:
      - "3004:80"
    networks:
      - webnet

  frontend5:
    build:
      context: ./nordic-roast
      dockerfile: Dockerfile.prd
    container_name: nordic_roast_frontend5
    ports:
      - "3005:80"
    networks:
      - webnet

  reverse-proxy:
    image: nginx:stable-alpine
    container_name: nginx_reverse_proxy
    volumes:
      - ./nginx-main.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    networks:
      - webnet
    depends_on:
      - frontend1
      - frontend2
      - frontend3
      - frontend4
      - frontend5
      - mail-server

networks:
  webnet:
