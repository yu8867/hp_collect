server {
    listen 80;
    server_name nexgen-web.com www.nexgen-web.com;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    # Cloudflare の HTTPS を正しく処理する
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # =========================
    # /app1 → frontend1
    # =========================
    location /app1/ {
        proxy_pass http://lp_collect_frontend1:80/;
    }

    # =========================
    # /app2 → frontend2
    # =========================
    location /app2/ {
        proxy_pass http://yorha_v2_frontend2:80/;
    }

    # =========================
    # /app3 → frontend3
    # =========================
    location /app3/ {
        proxy_pass http://kid_frontend3:80/;
    }

    # =========================
    # /app4 → frontend4
    # =========================
    location /app4/ {
        proxy_pass http://the_stack_burger_frontend4:80/;
    }
}